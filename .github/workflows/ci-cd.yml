name: BE CI/CD

on:
  pull_request:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Lint
        working-directory: apps/api
        run: uv run ruff check app tests
      - name: Unit tests
        working-directory: apps/api
        run: uv run pytest -m "not integration" -q

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.production.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: image
    runs-on: [self-hosted, linux, netbird, production]
    steps:
      - uses: actions/checkout@v4
      - name: Install deployment files
        run: bash deploy/production/install-compose.sh
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
      - name: Pull and restart BE
        working-directory: /opt/f-caps-schedule/deploy
        run: |
          docker compose pull api worker
          docker compose up -d postgres api worker
          docker compose ps
          docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
